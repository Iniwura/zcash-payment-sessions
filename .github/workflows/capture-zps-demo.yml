name: Capture ZPS production demo footage

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/capture-zps-demo.yml"
      - "scripts/video/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright for production capture
        run: |
          python3 -m pip install --user playwright==1.55.0
          python3 -m playwright install ffmpeg
          command -v google-chrome || command -v chromium
      - name: Capture real public browser interactions
        run: python3 -u scripts/video/capture_zps.py
      - name: Collect existing studio narration
        if: always()
        shell: bash
        run: |
          mkdir -p demo-capture
          curl --fail --location --silent --show-error --max-time 55 \
            'https://www.aidocmaker.com/g0/audio?name=39c7b66927334b359a1ae4f4268dc151' \
            --output demo-capture/narration.mp3 || true
          python3 - <<'PY'
          from pathlib import Path
          f=Path("demo-capture/narration.mp3")
          if f.exists():
              head=f.read_bytes()[:16]
              print("VOICEOVER_DOWNLOAD",f.stat().st_size,repr(head))
              if f.stat().st_size < 10000 or (not head.startswith(b'ID3') and head[0:1] != b'\xff'):
                  print("VOICEOVER_NOTE: unavailable; clearing HTML response")
                  f.unlink()
          PY
      - name: Upload actual screen recordings and narration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zps-production-demo-original-footage
          path: demo-capture/
          if-no-files-found: warn
          retention-days: 7
