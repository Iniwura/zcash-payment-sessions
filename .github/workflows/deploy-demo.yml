name: Deploy reference checkout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install native and Rust build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang
          rustup toolchain install nightly-2025-01-07 --component rust-src --target wasm32-unknown-unknown
          rustup target add wasm32-unknown-unknown
          cargo install just --version 1.58.0 --locked
          cargo install wasm-pack --version 0.13.1 --locked

      - name: Build pinned WebZjs packages and install dependencies
        run: npm run bootstrap:webzjs

      - name: Build reference checkout
        run: npm run demo:build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
