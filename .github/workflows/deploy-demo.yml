name: Deploy reference checkout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install native and Rust build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang
          rustup toolchain install nightly-2025-01-07 --component rust-src --target wasm32-unknown-unknown
          rustup target add wasm32-unknown-unknown
          cargo install just --version 1.58.0 --locked
          cargo install wasm-pack --version 0.13.1 --locked

      - name: Build pinned WebZjs packages and install dependencies
        run: npm run bootstrap:webzjs

      - name: Verify SDK, UI contracts, types and consumer integration
        run: |
          npm test
          npm run typecheck
          npm run build
          npm run test:consumer
          npm run demo:typecheck

      - name: Build reference checkout
        run: |
          npm run demo:build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

      # Build a second time with the root URL base required by Vercel.
      # This is a compiled, public static artifact; no wallet secrets are bundled.
      - name: Build Vercel static checkout
        run: GITHUB_ACTIONS=false npm run demo:build

      - name: Publish Vercel static artifact branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          cp -a dist-demo/. "$STAGE/"
          cd "$STAGE"
          git init -q -b vercel-static
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build(vercel): ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force --quiet origin HEAD:refs/heads/vercel-static

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
