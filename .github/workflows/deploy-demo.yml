name: Deploy reference checkout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install native and Rust build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang
          rustup toolchain install nightly-2025-01-07 --component rust-src --target wasm32-unknown-unknown
          rustup target add wasm32-unknown-unknown
          cargo install just --version 1.58.0 --locked
          cargo install wasm-pack --version 0.13.1 --locked

      - name: Build pinned WebZjs packages and install dependencies
        run: npm run bootstrap:webzjs

      - name: Verify SDK, UI contracts, types and consumer integration
        run: |
          npm run typecheck
          npm run build
          npm test
          npm run test:consumer
          npm run demo:typecheck

      - name: Build reference checkout
        run: |
          npm run demo:build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

      # Build a second time with the root URL base required by Vercel.
      # This is a compiled, public static artifact; no wallet secrets are bundled.
      - name: Build Vercel static checkout
        run: GITHUB_ACTIONS=false npm run demo:build

      - name: Browser interaction acceptance
        run: |
          set -euo pipefail
          python3 -m venv /tmp/zps-browser-acceptance
          /tmp/zps-browser-acceptance/bin/python -m pip install --disable-pip-version-check --quiet playwright==1.55.0
          mkdir -p visual-audit
          GITHUB_ACTIONS=false npm run demo:preview -- --host 127.0.0.1 --port 4173 > /tmp/zps-acceptance-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          /tmp/zps-browser-acceptance/bin/python scripts/browser-checkout-smoke.py

      - name: Browser smoke and responsive screenshots
        # Screenshot tooling can fail on hosted runners despite a valid built application.
        # Keep the release unblocked; retain logs and upload any captures for review.
        continue-on-error: true
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          mkdir -p visual-audit
          GITHUB_ACTIONS=false npm run demo:preview -- --host 127.0.0.1 --port 4173 > /tmp/zps-vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:4173/ > /tmp/zps-page.html; then break; fi
            sleep 1
          done
          if ! grep -q "A request" /tmp/zps-page.html; then
            echo "Unexpected preview HTML. Preview server logs:"
            cat /tmp/zps-vite-preview.log
            head -c 800 /tmp/zps-page.html
            exit 1
          fi
          if ! "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --no-first-run --window-size=1440,900 --screenshot="$PWD/visual-audit/desktop-1440.png" http://127.0.0.1:4173/ > /tmp/zps-browser-desktop.log 2>&1; then
            cat /tmp/zps-browser-desktop.log
            exit 1
          fi
          if ! "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --no-first-run --window-size=390,844 --screenshot="$PWD/visual-audit/mobile-390.png" http://127.0.0.1:4173/ > /tmp/zps-browser-mobile.log 2>&1; then
            cat /tmp/zps-browser-mobile.log
            exit 1
          fi
          test -s visual-audit/desktop-1440.png
          test -s visual-audit/mobile-390.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          for name in ("desktop-1440.png", "mobile-390.png"):
              blob = (Path("visual-audit") / name).read_bytes()
              assert blob[:8] == b"\x89PNG\r\n\x1a\n"
              width, height = struct.unpack(">II", blob[16:24])
              assert width > 0 and height > 0
              print(f"{name}: {width}x{height}")
          PY

      - name: Publish browser screenshots for visual review
        uses: actions/upload-artifact@v4
        with:
          name: zps-visual-audit
          path: visual-audit/*.png
          retention-days: 14
          if-no-files-found: warn

      - name: Publish Vercel static artifact branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          cp -a dist-demo/. "$STAGE/"
          cd "$STAGE"
          git init -q -b vercel-static
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build(vercel): ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force --quiet origin HEAD:refs/heads/vercel-static

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
