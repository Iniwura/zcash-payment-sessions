[package]
name = "sapling-memo-hydrator"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
getrandom = { version = "0.4", features = ["wasm_js"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "=0.2.100"
zcash_client_backend = { git = "https://github.com/zcash/librustzcash.git", rev = "3c76c2d822446a68b67cd25692aaf92b4f6cb98c", default-features = false }
zcash_keys = { git = "https://github.com/zcash/librustzcash.git", rev = "3c76c2d822446a68b67cd25692aaf92b4f6cb98c", default-features = false, features = ["std", "sapling"] }
zcash_primitives = { git = "https://github.com/zcash/librustzcash.git", rev = "3c76c2d822446a68b67cd25692aaf92b4f6cb98c", default-features = false, features = ["std"] }
zcash_protocol = { git = "https://github.com/zcash/librustzcash.git", rev = "3c76c2d822446a68b67cd25692aaf92b4f6cb98c", features = ["local-consensus"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
